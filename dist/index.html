<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BITS — Living Grid spike</title>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#06070D; --fog:#E9EBF5; --slate:#878DA3; --volt:#5E6CFF; --volt-soft:#9AA5FF;
    --font-mono:'JetBrains Mono','SFMono-Regular',Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--ink);color:var(--fog);overflow:hidden;font-family:var(--font-mono)}
  #grid-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* spike HUD: lets you judge the feel + read perf live */
  .hud{
    position:fixed;left:18px;bottom:16px;z-index:10;
    font-size:11px;letter-spacing:.12em;color:var(--slate);line-height:1.9;
    pointer-events:none;text-transform:uppercase;
  }
  .hud b{color:var(--volt-soft);font-weight:400}
  .hud .fps{color:var(--fog)}
  .badge{
    position:fixed;top:18px;left:18px;z-index:10;font-size:10px;letter-spacing:.28em;
    color:var(--slate);text-transform:uppercase;
  }
  .badge .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--volt);margin-right:8px;vertical-align:middle}
  .hint{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;
    font-size:11px;letter-spacing:.2em;color:var(--slate);text-transform:uppercase;
    opacity:0;transition:opacity .6s ease;pointer-events:none;text-align:center;
  }
  .hint.show{opacity:.55}

  /* fallback shown when WebGL/GPGPU unavailable or reduced-motion */
  .fallback{
    position:fixed;inset:0;z-index:20;display:none;place-items:center;
    background:var(--ink);text-align:center;padding:24px;
  }
  .fallback.on{display:grid}
  .fallback h1{font-family:'Clash Display',system-ui,sans-serif;font-weight:600;font-size:clamp(48px,12vw,140px);letter-spacing:-.02em}
  .fallback p{color:var(--slate);font-size:13px;letter-spacing:.06em;margin-top:14px;max-width:42ch}
</style>
  <script type="module" crossorigin src="/assets/index-DsXxF55A.js"></script>
</head>
<body>
  <p class="badge"><span class="dot"></span>Living Grid — engine spike</p>
  <canvas id="grid-canvas"></canvas>
  <p class="hint" id="hint">move your cursor through the field</p>
  <div class="hud" id="hud">
    <div>particles <b id="count">—</b></div>
    <div>fps <span class="fps" id="fps">—</span></div>
    <div>gpu <b id="gpu">—</b></div>
  </div>

  <div class="fallback" id="fallback">
    <div>
      <h1>BITS</h1>
      <p id="fallback-reason">Your browser or settings disable the live field — this is the static fallback.</p>
    </div>
  </div>

</body>
</html>
